<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Hexagone principal -->
  <g transform="translate(60, 60)">
    <!-- Branches géométriques -->
    <polygon points="0,-42 7,-14 0,-10 -7,-14" fill="#c9922a" opacity="0.9"/>
    <polygon points="36.4,21 10,7 11,0 16,-6" fill="#c9922a" opacity="0.7"/>
    <polygon points="36.4,-21 16,6 11,0 10,-7" fill="#1e5e1e" opacity="0.9"/>
    <polygon points="0,42 -7,14 0,10 7,14" fill="#1e5e1e" opacity="0.9"/>
    <polygon points="-36.4,-21 -10,-7 -11,0 -16,6" fill="#c9922a" opacity="0.7"/>
    <polygon points="-36.4,21 -16,-6 -11,0 -10,7" fill="#1e5e1e" opacity="0.7"/>

    <!-- Hexagone central -->
    <polygon points="0,-16 13.9,-8 13.9,8 0,16 -13.9,8 -13.9,-8" fill="#164a16"/>
    <polygon points="0,-12 10.4,-6 10.4,6 0,12 -10.4,6 -10.4,-6" fill="#2d7d2d"/>

    <!-- Initiales I, H, J, Y, L, A sur les branches -->
    <text x="0" y="-30" font-family="serif" font-size="7" fill="white" text-anchor="middle" font-weight="bold">I</text>
    <text x="25" y="-12" font-family="serif" font-size="7" fill="white" text-anchor="middle" font-weight="bold">H</text>
    <text x="25" y="18" font-family="serif" font-size="7" fill="white" text-anchor="middle" font-weight="bold">J</text>
    <text x="0" y="38" font-family="serif" font-size="7" fill="white" text-anchor="middle" font-weight="bold">Y</text>
    <text x="-25" y="18" font-family="serif" font-size="7" fill="white" text-anchor="middle" font-weight="bold">L</text>
    <text x="-25" y="-12" font-family="serif" font-size="7" fill="white" text-anchor="middle" font-weight="bold">A</text>

    <!-- Point central -->
    <circle cx="0" cy="0" r="3" fill="#c9922a"/>
  </g>
</svg>
